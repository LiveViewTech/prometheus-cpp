analysis:
  purpose:
    value: "C++ client library that implements the Prometheus data model so services can collect metrics and expose them via pull (HTTP exposer) or push (Pushgateway)."
    confidence: high
    evidence_refs:
      - lang-cpp
      - entry-registry
      - entry-exposer
      - entry-gateway
      - comp-core
      - comp-pull
      - comp-push
  architecture:
    value: "Three installable libraries on a shared core: core owns Registry/Family metric types and text serialization; pull embeds CivetWeb Exposer to serve /metrics; push uses libcurl Gateway to POST/PUT/DELETE to a Pushgateway. util is a private header-only helper (base64) used by pull/push."
    confidence: high
    evidence_refs:
      - comp-core
      - comp-pull
      - comp-push
      - comp-util
      - entry-registry
      - entry-exposer
      - entry-gateway
      - dep-civetweb
      - dep-curl
      - dep-core-internal
      - dep-util-internal
  patterns:
    - id: pattern-builder-metrics
      value: "Metrics are created via fluent builders (BuildCounter/BuildGauge/...) then Family::Add for label dimensions, registered into a shared Registry."
      confidence: high
      evidence_refs:
        - entry-registry
        - entry-sample-server
        - comp-core
    - id: pattern-weak-collectable
      value: "Exposer and Gateway hold weak_ptr Collectable references; callers must keep Registry (or other Collectable) alive for scrapes/pushes to observe data."
      confidence: high
      evidence_refs:
        - entry-exposer
        - entry-gateway
        - entry-registry
    - id: pattern-dual-build
      value: "Both CMake (with optional git submodules under 3rdparty) and Bazel modules are first-class; CI exercises each path separately."
      confidence: high
      evidence_refs:
        - fw-cmake
        - fw-bazel
        - cmd-bazel-test
        - cmd-cmake-configure
        - dep-civetweb
    - id: pattern-optional-libs
      value: "CMake gates pull/push/compression/testing via ENABLE_PULL, ENABLE_PUSH, ENABLE_COMPRESSION, ENABLE_TESTING options."
      confidence: high
      evidence_refs:
        - entry-cmake-root
        - comp-pull
        - comp-push
  component_notes:
    - ref: comp-core
      purpose: "Metric types (Counter, Gauge, Histogram, Summary, Info), Family labeling, Registry collection, and Prometheus text exposition serialization."
      confidence: high
    - ref: comp-pull
      purpose: "HTTP metrics exposer built on CivetWeb, with optional gzip compression, basic auth hooks, and self-instrumentation of scrape traffic."
      confidence: high
    - ref: comp-push
      purpose: "libcurl client for Prometheus Pushgateway Push/PushAdd/Delete (sync and async), including auth and custom headers."
      confidence: high
    - ref: comp-util
      purpose: "Header-only base64 helpers used by pull basic-auth and push; CMake exports an INTERFACE util target, Bazel limits visibility to package subpackages."
      confidence: high
    - ref: comp-cmake
      purpose: "CMake package config, pkg-config templates, third-party find modules, and consumer import smoke-test projects."
      confidence: high
    - ref: comp-bazel
      purpose: "Bazel helpers for export headers and vendored third-party BUILD wrappers used by the Bazel build."
      confidence: high
  service_notes:
    - ref: svc-pushgateway
      purpose: "Remote receiver for pushed metrics when pull scraping is unavailable."
      integration: "Gateway builds job URI host:port/metrics/job/<job> plus labels and sends text-format payloads via curl."
      confidence: high
    - ref: svc-prometheus-scraper
      purpose: "Pull-based collectors that scrape the Exposer /metrics endpoint."
      integration: "Exposer serves collectables over HTTP; Bazel CI/docs exercise scraping via Telegraf (//pull/tests/integration:scrape-test)."
      confidence: high
  dangerous_areas:
    - id: danger-registry-lifetime
      value: "Registry lifetime vs weak_ptr registration"
      reason: "README and APIs register collectables as weak_ptr; if the shared Registry is destroyed, exposer/gateway silently stop collecting those metrics."
      confidence: high
      evidence_refs:
        - entry-exposer
        - entry-gateway
        - entry-registry
    - id: danger-dynamic-family-add
      value: "Hot-path Family::Add with dynamic labels"
      reason: "README warns dynamic Family::Add is slow and high-cardinality labels violate Prometheus practices; prefer pre-created dimensional counters."
      confidence: high
      evidence_refs:
        - entry-sample-server
        - comp-core
    - id: danger-cmake-submodule-flags
      value: "CMake submodule CI disables push and compression"
      reason: "Submodule CI configures -DENABLE_PUSH=OFF -DENABLE_COMPRESSION=OFF because zlib/curl are not in submodules; local builds that expect those features must install system deps and flip the options."
      confidence: high
      evidence_refs:
        - cmd-cmake-configure
        - dep-curl
        - dep-zlib
    - id: danger-civetweb-version
      value: "CivetWeb minimum version 1.14"
      reason: "pull/src/handler.cc hard-errors if CIVETWEB_VERSION is below 1.14."
      confidence: high
      evidence_refs:
        - comp-pull
        - dep-civetweb
  questions:
    - id: q-lvt-fork-purpose
      question: "Remote is LiveViewTech/prometheus-cpp while README badges/docs still point at jupp0r/prometheus-cpp. What LVT-specific divergence, sync, or pinning policy should agents assume versus upstream?"
      area: ownership
      priority: high
      evidence_refs:
        - entry-module-bazel
        - entry-cmake-root
    - id: q-readme-bcr-version
      question: "README BCR example pins prometheus-cpp 1.2.4 while MODULE.bazel and CMake project version are 1.3.0 — which consumer version guidance is intentional?"
      area: docs
      priority: medium
      evidence_refs:
        - entry-module-bazel
        - entry-cmake-root
    - id: q-empty-submodules
      question: "3rdparty/civetweb and 3rdparty/googletest directories exist but submodule contents were empty in this checkout — is submodule init required for all CMake workflows, or is vcpkg/system packages the preferred path here?"
      area: build
      priority: medium
      evidence_refs:
        - dep-civetweb
        - dep-googletest
        - cmd-submodule-init
